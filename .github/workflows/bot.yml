name: Saham IDX Alert Bot

on:
  schedule:
    # Bursa IDX: Senin-Jumat 09:00-16:30 WIT (UTC+9)
    # Cek setiap 30 menit: 00:00-07:30 UTC = 09:00-16:30 WIT
    - cron: '*/30 0-7 * * 1-5'
  workflow_dispatch:  # Bisa trigger manual dari GitHub

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy ta requests schedule

      - name: Jalankan cek sinyal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scheduler_once.py

      - name: Simpan state ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot/state.json
          git diff --cached --quiet || git commit -m "chore: update bot state [skip ci]"
          git pull --rebase origin main
          git push
